<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali Baba | Administration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .request-card { background: white; border-radius: 12px; border-left: 5px solid #ff6a00; transition: 0.3s; }
        .tab-active { border-bottom: 3px solid #ff6a00; color: #ff6a00; font-weight: 900; }
    </style>
</head>
<body class="p-4 pb-20">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-black text-slate-800 uppercase italic">Dashboard Admin</h1>
        <button onclick="location.reload()" class="text-[#ff6a00] active:rotate-180 transition-transform">
            <i class="fa-solid fa-rotate"></i>
        </button>
    </div>

    <div class="flex justify-around mb-6 border-b border-slate-200 bg-white rounded-t-xl">
        <button onclick="showSection('recharges')" id="tab-recharges" class="flex-1 py-4 text-[10px] uppercase font-bold tab-active">Recharges</button>
        <button onclick="showSection('retraits')" id="tab-retraits" class="flex-1 py-4 text-[10px] uppercase font-bold">Retraits</button>
    </div>

    <div id="list-container" class="space-y-4">
        <p class="text-center text-slate-400 py-10 italic">Chargement des demandes...</p>
    </div>

    <script>
        const BASE_URL = "https://alibaba-f22a0-default-rtdb.firebaseio.com";
        let currentTab = 'recharges';

        function showSection(type) {
            currentTab = type;
            document.getElementById('tab-recharges').classList.remove('tab-active');
            document.getElementById('tab-retraits').classList.remove('tab-active');
            document.getElementById('tab-' + type).classList.add('tab-active');
            fetchRequests();
        }

        async function fetchRequests() {
            const listDiv = document.getElementById('list-container');
            listDiv.innerHTML = `<p class="text-center text-slate-400 py-10 italic">Chargement des ${currentTab}...</p>`;
            
            try {
                let mergedData = {};

                if (currentTab === 'recharges') {
                    const res = await fetch(`${BASE_URL}/recharges.json`);
                    mergedData = await res.json() || {};
                } else {
                    // Pour les retraits, charger à la fois "retraits" et "retraits_en_attente"
                    const [res1, res2] = await Promise.all([
                        fetch(`${BASE_URL}/retraits.json`),
                        fetch(`${BASE_URL}/retraits_en_attente.json`)
                    ]);
                    const data1 = await res1.json() || {};
                    const data2 = await res2.json() || {};
                    
                    // Fusion des deux nœuds Firebase
                    mergedData = { ...data1, ...data2 };
                }

                const keys = Object.keys(mergedData);
                if (keys.length === 0) {
                    listDiv.innerHTML = `<div class="text-center py-20 opacity-40"><i class="fa-solid fa-box-open text-4xl mb-2"></i><p>Aucune demande de ${currentTab}</p></div>`;
                    return;
                }

                const sortedIds = keys.reverse();

                listDiv.innerHTML = sortedIds.map(id => {
                    const req = mergedData[id] || {};
                    
                    // Mappage exact selon la structure Firebase (user, amount, receiverPhone, network)
                    const phone = req.user || req.phone || req.userPhone || 'Inconnu';
                    const rawMontant = req.amount !== undefined ? req.amount : (req.montant !== undefined ? req.montant : 0);
                    const receiver = req.receiverPhone || req.receveur || req.expediteur || 'N/A';
                    const network = req.network || req.reseau || 'Transfert';
                    const dateAffichage = req.date || 'Date inconnue';
                    const statut = req.status || 'En attente';

                    let statusBadge = '';
                    let actionButtons = '';

                    if (statut === 'Validé' || statut === 'Valide') {
                        statusBadge = `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-[9px] font-bold uppercase">Validé</span>`;
                    } else if (statut === 'Rejeté' || statut === 'Refusé') {
                        statusBadge = `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-[9px] font-bold uppercase">Rejeté</span>`;
                    } else {
                        statusBadge = `<span class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded text-[9px] font-bold uppercase">En attente</span>`;
                        actionButtons = `
                            <div class="flex gap-2 mt-4 pt-3 border-t border-slate-50">
                                <button onclick="processRequest('valider', '${id}', '${phone}', ${rawMontant})" 
                                        class="flex-1 bg-green-600 text-white py-3 rounded-xl text-[10px] font-black uppercase tracking-widest active:scale-95 transition-all">
                                    Valider
                                </button>
                                <button onclick="processRequest('rejeter', '${id}', '${phone}', ${rawMontant})" 
                                        class="flex-1 bg-red-50 text-red-600 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest active:scale-95 transition-all">
                                    Rejeter
                                </button>
                            </div>
                        `;
                    }

                    return `
                        <div id="card-${id}" class="request-card p-4 shadow-sm border-l-4 ${currentTab === 'recharges' ? 'border-green-500' : 'border-red-500'}">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="font-black text-slate-800 text-sm">Client: +${phone}</p>
                                    <p class="text-[10px] text-slate-500 font-bold">${currentTab === 'recharges' ? 'Expéditeur' : 'Bénéficiaire'}: ${receiver}</p>
                                    <p class="text-[9px] text-slate-400 italic">${dateAffichage}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-lg font-black text-slate-900">FC ${parseFloat(rawMontant).toLocaleString()}</p>
                                    <p class="text-[9px] font-bold text-[#ff6a00] uppercase mb-1">${network}</p>
                                    ${statusBadge}
                                </div>
                            </div>
                            ${actionButtons}
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error(e);
                listDiv.innerHTML = "<p class='text-center text-red-500 font-bold'>Erreur lors de la récupération des données</p>";
            }
        }

        async function processRequest(action, id, phone, montant) {
            const confirmMsg = action === 'valider' ? `Approuver FC ${montant} pour +${phone} ?` : `Rejeter cette demande ?`;
            if (!confirm(confirmMsg)) return;

            try {
                const cleanPhone = phone.toString().replace('+', '').trim();

                // 1. Mise à jour du solde dans Firebase si validé
                if (action === 'valider') {
                    const userRes = await fetch(`${BASE_URL}/users/${cleanPhone}.json`);
                    const user = await userRes.json();

                    if (user) {
                        let soldeActuel = parseFloat(user.balance) || 0;
                        let nouveauSolde = currentTab === 'recharges' 
                            ? soldeActuel + parseFloat(montant) 
                            : Math.max(0, soldeActuel - parseFloat(montant));

                        await fetch(`${BASE_URL}/users/${cleanPhone}.json`, {
                            method: 'PATCH',
                            body: JSON.stringify({ balance: nouveauSolde })
                        });
                    }
                }
                
                // 2. Mise à jour du statut dans les deux emplacements potentiels de retraits/recharges
                const nouveauStatut = action === 'valider' ? 'Validé' : 'Rejeté';
                const patchData = JSON.stringify({ status: nouveauStatut });

                if (currentTab === 'recharges') {
                    await fetch(`${BASE_URL}/recharges/${id}.json`, { method: 'PATCH', body: patchData });
                } else {
                    await Promise.all([
                        fetch(`${BASE_URL}/retraits/${id}.json`, { method: 'PATCH', body: patchData }),
                        fetch(`${BASE_URL}/retraits_en_attente/${id}.json`, { method: 'PATCH', body: patchData })
                    ]);
                }

                // 3. Rafraîchissement de la liste
                fetchRequests();

            } catch (e) {
                alert("Erreur lors de l'opération.");
                console.error(e);
            }
        }

        window.onload = fetchRequests;
    </script>
</body>
</html>
